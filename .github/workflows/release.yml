name: Release

# Push a tag matching package.json's version (e.g. v0.3.0) to build a signed APK and publish it
# as a GitHub Release. Downloader installs it from:
#   https://github.com/<owner>/<repo>/releases/latest/download/lttv.apk
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Check the tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun test
          bun run check
          bunx tsc -p .
          (cd android && ./gradlew -q testDebugUnitTest)

      - name: Build signed APK
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          LTTV_KEYSTORE_BASE64: ${{ secrets.LTTV_KEYSTORE_BASE64 }}
          LTTV_KEYSTORE_PASSWORD: ${{ secrets.LTTV_KEYSTORE_PASSWORD }}
        run: |
          export LTTV_KEYSTORE="$RUNNER_TEMP/lttv-release.jks"
          echo "$LTTV_KEYSTORE_BASE64" | base64 -d > "$LTTV_KEYSTORE"
          bash scripts/build-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lttv.apk --title "LTTV $GITHUB_REF_NAME" --generate-notes
